spring:
  datasource:
    url: jdbc:h2:mem:catalog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
mybatis:
  type-handlers-package: com.sskengine.commerceflow.contracts.mybatis
  configuration:
    map-underscore-to-camel-case: true

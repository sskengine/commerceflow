server:
  port: 8082
spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/commerceflow?currentSchema=${DB_SCHEMA:catalog}
    username: ${DB_USER:commerceflow}
    password: ${DB_PASSWORD:commerceflow}
  flyway:
    schemas: ${DB_SCHEMA:catalog}
    default-schema: ${DB_SCHEMA:catalog}
mybatis:
  type-handlers-package: com.sskengine.commerceflow.contracts.mybatis
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints.web.exposure.include: health,info

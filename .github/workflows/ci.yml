name: commerceflow-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify reactor
        run: mvn --batch-mode clean verify
      - name: Validate traceability
        run: python3 scripts/validate-traceability.py
      - name: Validate critical contract links
        run: python3 scripts/validate-contract-links.py


server:
  port: 8083
spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/commerceflow?currentSchema=${DB_SCHEMA:inventory}
    username: ${DB_USER:commerceflow}
    password: ${DB_PASSWORD:commerceflow}
  flyway:
    schemas: ${DB_SCHEMA:inventory}
    default-schema: ${DB_SCHEMA:inventory}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
mybatis:
  type-handlers-package: com.sskengine.commerceflow.contracts.mybatis
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints.web.exposure.include: health,info

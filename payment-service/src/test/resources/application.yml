spring:
  datasource:
    url: jdbc:h2:mem:payment;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate.ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
clients:
  provider:
    base-url: http://127.0.0.1:9

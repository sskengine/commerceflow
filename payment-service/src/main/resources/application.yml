server:
  port: 8085
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/commerceflow?currentSchema=${DB_SCHEMA:payment}
    username: ${DB_USER:commerceflow}
    password: ${DB_PASSWORD:commerceflow}
  flyway:
    schemas: ${DB_SCHEMA:payment}
    default-schema: ${DB_SCHEMA:payment}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
clients:
  provider:
    base-url: ${PROVIDER_BASE_URL:http://127.0.0.1:8090}
mybatis:
  type-handlers-package: com.sskengine.commerceflow.contracts.mybatis
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints.web.exposure.include: health,info
